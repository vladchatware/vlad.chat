name: VladChat
options:
  bundleIdPrefix: chat.vlad
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L6775788HZ
configs:
  Debug: debug
  Release: release
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
  Textual:
    url: https://github.com/tinfoilsh/textual
    branch: main
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
targets:
  VladChat:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.SignInWithApple:
          enabled: 1
    entitlements:
      path: VladChat.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: chat.vlad.ios
        PRODUCT_NAME: VladChat
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
      - package: Textual
        product: Textual
      - package: SwiftMath
        product: SwiftMath
    scheme:
      testTargets:
        - VladChatTests
  VladChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.vlad.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VladChat
